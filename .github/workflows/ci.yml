name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y gcov gcovr
      - name: Build
        run: make -j
      - name: Test
        run: make test
